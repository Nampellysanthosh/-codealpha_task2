{% extends 'base.html' %}

{% block title %}@{{ profile_username }} - Connect{% endblock %}

{% block content %}
<main class="profile-page" data-username="{{ profile_username }}">
    <a class="profile-back" href="/home/"><i data-lucide="arrow-left"></i> Back to feed</a>
    <section class="profile-cover"></section>
    <section class="profile-card">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <div class="profile-main">
            <h1 id="profileName">@{{ profile_username }}</h1>
            <p id="profileBio">Loading profile...</p>
            <div class="profile-stats">
                <span><strong id="profilePostCount">0</strong> posts</span>
                <span><strong>0</strong> followers</span>
                <span><strong>0</strong> following</span>
            </div>
        </div>
        <button class="button button-primary" id="followButton" type="button">Follow</button>
    </section>
    <section id="profilePosts" class="profile-posts"></section>
</main>
{% endblock %}
